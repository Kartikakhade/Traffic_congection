data:
  dataset_path: data/traffic.csv
  timestamp_col: DateTime
  entity_col: Junction
  feature_columns:
    - Vehicles
  target_mode: future_target_column
  target_column: Vehicles
  window_size: 24
  horizon_steps: 1
  future_average_steps: 3
  split_ratio: 0.8
  sample_interval_minutes: 60
  peak_hours:
    - 6
    - 7
    - 8
    - 9
    - 10
    - 16
    - 17
    - 18
    - 19
    - 20

preprocessing:
  normalization: minmax
  use_engineered_features: true
  use_peak_indicator: true
  use_congestion_transition: true
  use_temporal_features: true
  use_lag_features: true
  use_entity_one_hot: true

model:
  hidden_units:
    - 64
    - 32
  dropout: 0.2
  dense_units: 64
  learning_rate: 0.001
  batch_size: 128
  epochs: 20
  loss: huber
  early_stopping: true
  early_stopping_patience: 5
  gradient_clipnorm: 1.0
  random_seed: 42

xgboost:
  max_depth: 8
  learning_rate: 0.03
  n_estimators: 800
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 1.0

ensemble:
  weight: 0.7
  search_validation_weight: true
  search_min: 0.0
  search_max: 1.0
  search_step: 0.02
  optimization_metric: accuracy

evaluation:
  num_classes: 3
  bins_strategy: quantile
  groupwise_bins: true
  paper_target_accuracy: 91.3

output_dir: artifacts/upgraded
